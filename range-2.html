<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rayon d'action 1 750 NM — EMB-145 LR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --offwhite:#F5F3EF; --red:#E8001C; --bordeaux:#8B0000;
    --navy:#1a1a2e; --grey:#9a9a9f; --line:#e2ded6; --hair:#f4f1ec; --panel:390px;
    --blue:#0F5FA8; --shade:#7A7C82;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--sans);color:var(--navy);background:var(--offwhite);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;height:100%;width:100%}
  #panel{width:var(--panel);flex:0 0 var(--panel);background:var(--white);
         border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}

  .phead{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--grey);margin:0 0 7px}
  h1{font-size:19px;line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em}
  h1 span{color:var(--red)}

  /* --- Selecteur de centre --- */
  .center-box{padding:14px 22px 16px;border-bottom:1px solid var(--line);position:relative}
  .cur-row{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
  .cur-row .eyebrow{margin:0;white-space:nowrap}
  .cur{display:flex;align-items:baseline;gap:9px;margin-bottom:0}
  .cur .ic{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--red);letter-spacing:.02em}
  .cur .tx{font-size:12.5px;line-height:1.35;color:var(--navy);overflow:hidden}
  .cur .tx i{font-style:normal;display:block;color:var(--grey);font-size:11px}
  .search{position:relative}
  .search input{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--line);border-radius:2px;
    font-family:var(--sans);font-size:13px;color:var(--navy);background:var(--offwhite)}
  .search input:focus{outline:none;border-color:var(--red);background:#fff}
  .search::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;
    margin-top:-7px;border:1.6px solid var(--grey);border-radius:50%}
  .search::after{content:"";position:absolute;left:20px;top:50%;width:5px;height:1.6px;
    margin-top:3px;background:var(--grey);transform:rotate(45deg)}
  #results{position:absolute;left:22px;right:22px;top:100%;margin-top:-8px;z-index:1200;
    background:#fff;border:1px solid var(--line);border-radius:2px;max-height:330px;overflow-y:auto;
    box-shadow:0 8px 24px rgba(26,26,46,.13);display:none}
  #results.open{display:block}
  .res{display:grid;grid-template-columns:48px 1fr;gap:9px;align-items:baseline;
    padding:8px 12px;width:100%;border:0;background:none;text-align:left;cursor:pointer;
    font-family:inherit;color:inherit;border-bottom:1px solid var(--hair)}
  .res:hover,.res:focus-visible{background:var(--offwhite)}
  .res:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
  .res b{font-family:var(--mono);font-size:12.5px;font-weight:600}
  .res span{font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res span i{font-style:normal;color:var(--grey);font-size:10.5px;display:block}
  .res-none{padding:11px 12px;font-size:12px;color:var(--grey)}

  .figs{display:block;padding:14px 22px 16px;border-bottom:1px solid var(--line)}
  .fig-line{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;
    background:var(--offwhite);font-size:13px;color:var(--navy);text-align:center}




  #map{flex:1;height:100%;background:var(--offwhite)}
  .leaflet-container{font-family:var(--sans)}
  .leaflet-popup-content-wrapper{border-radius:2px;box-shadow:0 2px 14px rgba(26,26,46,.16)}
  .leaflet-popup-content{margin:11px 14px;font-size:12.5px;line-height:1.5}
  .pop-icao{font-family:var(--mono);font-weight:600;font-size:13px}
  .pop-d{font-family:var(--mono);font-size:11.5px;color:var(--grey);margin-top:3px}
  .pop-n{font-size:11px;color:var(--grey);font-style:italic;margin-top:3px}
  .pop-v{display:inline-block;margin-top:6px;font-size:10px;font-family:var(--mono);
    letter-spacing:.1em;text-transform:uppercase}
  .pop-v.in{color:var(--red)} .pop-v.band{color:var(--bordeaux)} .pop-v.out{color:var(--grey)}

  @media (max-width:860px){
    html,body{height:auto;background:#fff}
    body{overflow:auto}
    #app{flex-direction:column;height:auto;min-height:0}
    #panel{display:contents}
    .phead{order:1;background:#fff}
    #map{order:2;height:300px;min-height:260px;flex:none}
    .center-box{order:4;background:#fff;border-bottom:0;padding:10px 22px 10px}
    #results{position:static;margin:8px 0 0;box-shadow:none;max-height:250px}
    .figs{order:5;background:#fff;padding:6px 22px 12px;border-bottom:0}
    .phead{padding:12px 22px 10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  "use strict";
  var R=1750, NM=1852;
  var center={icao:"GMMN", apt:"Mohammed V", city:"Casablanca", cc:"Maroc", lat:33.3703, lon:-7.5829};

  /* ---------- Géodésie WGS84 ---------- */
  function direct(lat1,lon1,a1,s){
    var a=6378137.0,f=1/298.257223563,b=(1-f)*a;
    var p1=lat1*Math.PI/180,l1=lon1*Math.PI/180,al1=a1*Math.PI/180;
    var sA=Math.sin(al1),cA=Math.cos(al1);
    var tU1=(1-f)*Math.tan(p1),cU1=1/Math.sqrt(1+tU1*tU1),sU1=tU1*cU1;
    var s1=Math.atan2(tU1,cA),sAl=cU1*sA,c2a=1-sAl*sAl;
    var u2=c2a*(a*a-b*b)/(b*b);
    var A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
    var B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
    var sig=s/(b*A),sigP=2*Math.PI,c2sm=0,sS=0,cS=0,dS=0,i=0;
    while(Math.abs(sig-sigP)>1e-12&&++i<200){
      c2sm=Math.cos(2*s1+sig);sS=Math.sin(sig);cS=Math.cos(sig);
      dS=B*sS*(c2sm+B/4*(cS*(-1+2*c2sm*c2sm)-B/6*c2sm*(-3+4*sS*sS)*(-3+4*c2sm*c2sm)));
      sigP=sig;sig=s/(b*A)+dS;
    }
    var t=sU1*sS-cU1*cS*cA;
    var p2=Math.atan2(sU1*cS+cU1*sS*cA,(1-f)*Math.sqrt(sAl*sAl+t*t));
    var lam=Math.atan2(sS*sA,cU1*cS-sU1*sS*cA);
    var C=f/16*c2a*(4+f*(4-3*c2a));
    var L=lam-(1-C)*f*sAl*(sig+C*sS*(c2sm+C*cS*(-1+2*c2sm*c2sm)));
    return [p2*180/Math.PI,(((l1+L)*180/Math.PI+540)%360)-180];
  }
  function inverse(lat1,lon1,lat2,lon2){
    var a=6378137.0,f=1/298.257223563,b=(1-f)*a;
    var L=(lon2-lon1)*Math.PI/180;
    var U1=Math.atan((1-f)*Math.tan(lat1*Math.PI/180));
    var U2=Math.atan((1-f)*Math.tan(lat2*Math.PI/180));
    var sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
    var lam=L,lamP,ss,cs,sig,sa,c2a,c2sm,C,i=0;
    do{
      var sL=Math.sin(lam),cL=Math.cos(lam);
      ss=Math.sqrt(Math.pow(cU2*sL,2)+Math.pow(cU1*sU2-sU1*cU2*cL,2));
      if(ss===0) return {d:0,b:0};
      cs=sU1*sU2+cU1*cU2*cL; sig=Math.atan2(ss,cs);
      sa=cU1*cU2*sL/ss; c2a=1-sa*sa;
      c2sm=c2a!==0?cs-2*sU1*sU2/c2a:0;
      C=f/16*c2a*(4+f*(4-3*c2a)); lamP=lam;
      lam=L+(1-C)*f*sa*(sig+C*ss*(c2sm+C*cs*(-1+2*c2sm*c2sm)));
    }while(Math.abs(lam-lamP)>1e-12&&++i<200);
    var u2=c2a*(a*a-b*b)/(b*b);
    var A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
    var B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
    var dS=B*ss*(c2sm+B/4*(cs*(-1+2*c2sm*c2sm)-B/6*c2sm*(-3+4*ss*ss)*(-3+4*c2sm*c2sm)));
    var brg=Math.atan2(cU2*Math.sin(lam),cU1*sU2-sU1*cU2*Math.cos(lam))*180/Math.PI;
    return {d:(b*A*(sig-dS))/NM,b:(brg+360)%360};
  }
  function ring(nm){
    var pts=[],s=nm*NM,prev=null;
    for(var a=0;a<360.0001;a+=0.5){
      var p=direct(center.lat,center.lon,a%360,s);
      if(prev!==null){ // continuite en longitude, evite le trait qui traverse la carte
        while(p[1]-prev>180) p[1]-=360;
        while(p[1]-prev<-180) p[1]+=360;
      }
      prev=p[1]; pts.push(p);
    }
    return pts;
  }
  function pad3(n){n=Math.round(n)%360;return (n<100?(n<10?"00":"0"):"")+n;}
  function fmt(n){return Math.round(n).toLocaleString("fr-FR");}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  /* ---------- Carte ---------- */
  var map=L.map("map",{zoomControl:true,worldCopyJump:false,minZoom:2,zoomSnap:.25}).setView([33.37,-7.58],4);
  L.control.scale({imperial:false,maxWidth:140}).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_269n_1_75a47770d40169727a932058",
    {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
     subdomains:"abcd",maxZoom:19}).addTo(map);

  /* Une seule couche : 32 % reprend le cumul des deux disques superposes. */
  var ring1300=L.polygon([],{color:"#0F5FA8",weight:1.4,opacity:1,
      fill:true,fillColor:"#7A7C82",fillOpacity:.32,interactive:false}).addTo(map);
  var ctrMarker=L.circleMarker([0,0],{radius:5,color:"#8B0000",weight:2,
      fillColor:"#fff",fillOpacity:1}).addTo(map);

  var STYLE={
    "in":{radius:1,stroke:false,fillColor:"#E8001C",fillOpacity:1},
    "out":{radius:1,stroke:false,fillColor:"#9a9a9f",fillOpacity:.5}
  };
  /* halo invisible mais peint : c'est lui qui recoit le clic, pas la pastille */
  var HIT={radius:("ontouchstart" in window?18:9),stroke:false,fillColor:"#E8001C",fillOpacity:0.01,interactive:true};
  var LABEL={"in":"Dans le rayon","out":"Hors rayon"};

  var caps=CAPS.map(function(r){
    return {cap:r[0],cc:r[1],icao:r[2],apt:r[3],lat:r[4],lon:r[5],note:r[6],

  });
  caps.forEach(function(p){
    p.hit=L.circleMarker([p.lat,p.lon],HIT).addTo(map);          // dessous, cliquable
    p.hit.on("click",function(ev){
      L.DomEvent.stop(ev);
      L.popup({offset:[0,-4]}).setLatLng([p.lat,p.lon]).setContent(p.pHtml||"").openOn(map);
    });
    p.m=L.circleMarker([p.lat,p.lon],STYLE.out).addTo(map);      // dessus, decoratif
    p.m.options.interactive=false;
  });

  /* ---------- Recalcul ---------- */
  function refresh(fit){
    ring1300.setLatLngs(ring(R));
    ctrMarker.setLatLng([center.lat,center.lon]).bindPopup(
      '<div class="pop-icao">'+esc(center.icao)+"</div><div>"+esc(center.apt)+
      (center.city?"<br>"+esc(center.city)+", "+esc(center.cc):"")+"</div>"+
      '<span class="pop-v in">Terrain de départ</span>');

    caps.forEach(function(p){
      var v=inverse(center.lat,center.lon,p.lat,p.lon);
      p.d=v.d; p.brg=v.b;
      p.band=v.d<=R?"in":"out";
      p.m.setStyle(STYLE[p.band]);
      p.pHtml=
        '<div class="pop-icao">'+esc(p.cap)+"</div><div>"+esc(p.apt)+" · "+esc(p.icao)+
        "<br>"+esc(p.cc)+"</div>"+
        '<div class="pop-d">'+fmt(p.d*1.852)+" km · azimut "+pad3(p.brg)+"°</div>"+
        (p.note?'<div class="pop-n">'+esc(p.note)+"</div>":"")+
        '<span class="pop-v '+p.band+'">'+LABEL[p.band]+"</span>";
    });

    document.getElementById("curIcao").textContent=center.icao;
    document.getElementById("curName").innerHTML=esc(center.apt)+
      "<i>"+(center.city?esc(center.city)+", "+esc(center.cc):esc(center.cc))+"</i>";
    if(fit!==false) fitRing();
  }

  function fitRing(){
    var el=document.getElementById("map");
    if(!el||!el.offsetWidth||!el.offsetHeight) return;  // carte cachée : ne rien faire
    map.invalidateSize();
    map.fitBounds(ring1300.getBounds(),{padding:[18,18]});
  }
  window.fitRing=fitRing;
  var _rft;
  window.addEventListener("resize",function(){
    clearTimeout(_rft);
    _rft=setTimeout(fitRing,250);
  });


  /* ---------- Recherche du terrain de départ ---------- */
  function notifyParent(){try{if(parent&&parent.fitRayonFrame){parent.fitRayonFrame._retried=true;parent.fitRayonFrame();}}catch(e){}}
  var q=document.getElementById("q"), box=document.getElementById("results");
  function search(term){
    term=term.trim().toLowerCase();
    if(term.length<2) return [];
    var starts=[], has=[];
    for(var i=0;i<CENTERS.length;i++){
      var c=CENTERS[i];
      var hay=(c[0]+" "+c[1]+" "+c[2]+" "+c[3]).toLowerCase();
      var pos=hay.indexOf(term);
      if(pos<0) continue;
      (c[0].toLowerCase().indexOf(term)===0||c[2].toLowerCase().indexOf(term)===0
        ? starts : has).push(c);
      if(starts.length+has.length>200) break;
    }
    return starts.concat(has).slice(0,40);
  }
  function showResults(){
    var r=search(q.value);
    if(!q.value.trim()||q.value.trim().length<2){box.classList.remove("open");box.innerHTML="";notifyParent();return;}
    box.innerHTML="";
    if(!r.length){
      box.innerHTML='<p class="res-none">Aucun terrain. Utilise les coordonnées manuelles.</p>';
      box.classList.add("open"); notifyParent(); return;
    }
    r.forEach(function(c){
      var b=document.createElement("button");
      b.className="res"; b.type="button"; b.setAttribute("role","option");
      b.innerHTML="<b>"+esc(c[0])+"</b><span>"+esc(c[1])+
        "<i>"+esc(c[2])+", "+esc(c[3])+"</i></span>";
      b.addEventListener("click",function(){
        center={icao:c[0],apt:c[1],city:c[2],cc:c[3],lat:c[4],lon:c[5]};
        q.value=""; box.classList.remove("open"); box.innerHTML="";
        refresh(true); notifyParent();
      });
      box.appendChild(b);
    });
    box.classList.add("open");notifyParent();
  }
  q.addEventListener("input",showResults);
  q.addEventListener("focus",showResults);
  q.addEventListener("keydown",function(e){
    if(e.key==="Escape"){box.classList.remove("open");q.blur();}
    if(e.key==="ArrowDown"){var f=box.querySelector(".res");if(f){e.preventDefault();f.focus();}}
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".center-box")) box.classList.remove("open");
  });


  refresh(true);
